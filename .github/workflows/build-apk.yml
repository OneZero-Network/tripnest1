name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI + prebuild
        run: |
          npx expo prebuild --platform android --non-interactive

      - name: Force JS bundle into debug build
        # Debug builds normally expect a live Metro server (localhost:8081) on the device,
        # which is why "Unable to load script" appears when the APK is installed standalone
        # with no bundler running nearby. This makes the debug build self-contained instead,
        # same JS-bundling behavior a release build would have, without needing a signing key.
        run: |
          sed -i '/^react {/a\    bundleInDebug = true' android/app/build.gradle
          grep -A2 "^react {" android/app/build.gradle

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK (debug, no signing needed)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tripnest-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
