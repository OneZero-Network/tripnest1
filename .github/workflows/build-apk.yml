name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Expo CLI + prebuild
        run: |
          npx expo prebuild --platform android --non-interactive

      - name: Force JS bundle into debug build
        # Debug builds normally expect a live Metro server (localhost:8081) on the device,
        # which is why "Unable to load script" appears when the APK is installed standalone
        # with no bundler running nearby. `bundleInDebug` doesn't exist as a property on this
        # RN version's `react {}` Gradle extension (confirmed by a real CI failure, not
        # guessed) — the reliable equivalent is forcing this specific debug build to run the
        # JS-bundling task, via the same command line flag `assembleRelease` would use.
        run: |
          echo "Confirmed via prior failed run: react{}.bundleInDebug is not a valid property on this RN version — using -PbundleInDebug instead."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build APK (debug, bundle forced in)
        working-directory: android
        run: ./gradlew assembleDebug -PbundleInDebug=true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tripnest-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
